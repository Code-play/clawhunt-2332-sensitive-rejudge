services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ipsensitive
      POSTGRES_PASSWORD: ipsensitive_local_dev
      POSTGRES_DB: ipsensitive
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsensitive -d ipsensitive"]
      interval: 5s
      timeout: 3s
      retries: 10
